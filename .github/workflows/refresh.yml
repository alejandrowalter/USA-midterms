name: Actualizar mercados y escrutinio

on:
  schedule:
    # El mínimo de GitHub es 5 min, pero el schedule llega tarde o no dispara
    # (en este repo */5 arrancaba ~cada 30 min, sobre todo cerca del :00).
    # Estas dos horas van corridas del :00. El job, una vez en marcha, refresca
    # solo cada 8 min durante un rato, así un arranque tardío igual cubre el hueco.
    - cron: '7 * * * *'
    - cron: '37 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'sources.json'
      - '.github/workflows/refresh.yml'

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # La noche electoral alarga el bucle a 4 h. 330 cubre eso y la última espera.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probar el normalizador
        run: python3 scripts/test_normalize.py
      - name: Refrescar la copia cada 8 minutos
        run: |
          set +e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # 8 min, no 5: Pages tiene un tope blando de 10 builds por hora.
          # Un commit cada 5 min son 12 builds y GitHub puede saltarse el sitio.
          # 8 min son ~7 por hora y dejan margen para un push de código.
          INTERVAL=480
          # Noche electoral: 3 nov 16:00 a 6 nov 12:00, hora de Bogotá (UTC−5, sin horario de verano).
          now=$(date -u +%s)
          night_start=$(date -u -d '2026-11-03 21:00:00 UTC' +%s)
          night_end=$(date -u -d '2026-11-06 17:00:00 UTC' +%s)
          if [ "$now" -ge "$night_start" ] && [ "$now" -le "$night_end" ]; then
            window=240
          else
            window=75
          fi
          echo "bucle de ${window} min, copia nueva cada 8 min"
          deadline=$((SECONDS + window * 60))
          published=0

          publish() {
            mkdir -p /tmp/midterms-snap
            cp data/page.json data/results.json /tmp/midterms-snap/
            local i
            for i in 1 2 3 4; do
              git fetch --depth=1 origin +refs/heads/main:refs/remotes/origin/main
              git checkout -f -B data-refresh origin/main
              cp /tmp/midterms-snap/page.json data/page.json
              cp /tmp/midterms-snap/results.json data/results.json
              git add data/page.json data/results.json
              if git diff --cached --quiet; then
                echo "sin cambios"
                return 0
              fi
              git commit -m "datos: Polymarket y escrutinio $(date -u +%Y-%m-%dT%H:%MZ)"
              if git push origin HEAD:main; then
                return 0
              fi
              echo "push rechazado, reintento $i"
              sleep $((5 * i))
            done
            echo "no se pudo publicar esta copia"
            return 1
          }

          while true; do
            python3 scripts/refresh.py
            if [ $? -eq 0 ]; then
              publish
              if [ $? -eq 0 ]; then
                published=$((published + 1))
              fi
            else
              echo "refresh falló; se conserva la copia anterior"
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              break
            fi
            echo "espera 8 min"
            sleep "$INTERVAL"
          done

          echo "copias publicadas: $published"
          if [ "$published" -eq 0 ]; then
            exit 1
          fi
