name: Actualizar mercados y escrutinio

on:
  schedule:
    # GitHub no garantiza el minuto exacto: en la práctica cada 5–15 min.
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'sources.json'
      - '.github/workflows/refresh.yml'

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probar el normalizador
        run: python3 scripts/test_normalize.py
      - name: Descargar Polymarket y el NYT
        run: python3 scripts/refresh.py
      - name: Commit si cambió
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/page.json data/results.json
          if git diff --cached --quiet; then
            echo "sin cambios"
            exit 0
          fi
          git commit -m "datos: Polymarket y escrutinio $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep $((5 * i))
          done
          exit 1
